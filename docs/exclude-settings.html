<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>除外設定 — 公演スケジュール</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .settings-section {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .settings-section h2 {
      font-size: 15px;
      font-weight: bold;
      color: #1a1a2e;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f0f0f0;
    }
    .standing-mode-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 14px;
      color: #333;
    }
    .standing-venue-list {
      margin: 10px 0 0 24px;
      padding-top: 6px;
      border-top: 1px solid #f5f5f5;
    }
    .standing-venue-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 13px;
      color: #444;
    }
    .keyword-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .keyword-row:last-child { border-bottom: none; }
    .keyword-text {
      flex: 1;
      font-size: 14px;
      color: #333;
    }
    .btn-unfollow {
      padding: 5px 14px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      color: #666;
      flex-shrink: 0;
    }
    .btn-unfollow:hover { background: #f5f5f5; }
    .empty-msg {
      font-size: 13px;
      color: #999;
      padding: 8px 0;
    }
    .add-form {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .add-form input[type="text"] {
      flex: 1;
      min-width: 200px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .btn-add {
      padding: 8px 18px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-add:hover { opacity: 0.85; }
    .btn-add:disabled { opacity: 0.5; cursor: default; }
    .status-msg {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 10px;
      display: none;
    }
    .status-msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .status-msg.error   { background: #fce4e4; color: #c62828; display: block; }
    .status-msg.info    { background: #e3f2fd; color: #1565c0; display: block; }
    .loading-overlay {
      text-align: center;
      padding: 24px;
      color: #999;
      font-size: 13px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 13px;
      color: #666;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    .nav-links {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>除外設定</h1>
      </div>
      <div id="userAvatar" class="user-avatar" style="display:none" title=""></div>
    </div>
  </header>

  <div class="container">
    <div class="nav-links">
      <a href="index.html" class="back-link">← 公演スケジュールへ戻る</a>
      <a href="settings.html" class="back-link">芸人管理はこちら →</a>
    </div>

    <!-- 定常公演を除外する -->
    <div class="settings-section">
      <h2>定常公演を除外する</h2>
      <p style="font-size:13px;color:#666;margin-bottom:12px;">
        劇場主催で月内に何度も開催される寄席・冠番組（定常公演）をまとめて非表示にできます。
      </p>
      <div id="standingExcludeControls">
        <div class="loading-overlay">読み込み中...</div>
      </div>
      <div class="status-msg" id="standingMsg"></div>
    </div>

    <!-- 除外キーワード -->
    <div class="settings-section">
      <h2>除外キーワード</h2>
      <p style="font-size:13px;color:#666;margin-bottom:12px;">
        公演タイトルにこれらの語を含む公演は、一覧表示とメール通知から除外されます（部分一致）。
      </p>
      <div id="excludeKeywordList">
        <div class="loading-overlay">読み込み中...</div>
      </div>
      <div class="add-form">
        <input type="text" id="addKeyword" placeholder="除外したいキーワード">
        <button class="btn-add" id="addKeywordBtn" onclick="handleAddKeyword()">追加</button>
      </div>
      <div class="status-msg" id="keywordMsg"></div>
    </div>
  </div>

  <script src="assets/exclude-settings.js"></script>
</body>
</html>
