<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公演スケジュール</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>公演スケジュール</h1>
        <p id="lastUpdated">最終更新: —</p>
      </div>
      <div class="header-right">
        <a href="exclude-settings.html" class="settings-link" title="除外設定">&#x2298;</a>
        <a href="settings.html" class="settings-link" title="設定">&#x2699;</a>
        <div id="userAvatar" class="user-avatar" style="display:none" title=""></div>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="sticky-controls">
      <div class="tabs">
        <button class="tab-btn active" data-tab="all">全員</button>
      </div>
      <div class="filter-bar" id="filterBar">
        <div>
          <label class="filter-label" data-icon="🔍">キーワード</label>
          <input type="text" id="filterKeyword" placeholder="公演名・出演者を検索（スペースでAND）">
        </div>
        <div>
          <label class="filter-label" data-icon="📍">会場</label>
          <select id="filterVenue">
            <option value="">すべて</option>
          </select>
          <label class="filter-label" data-icon="👀">観覧ステータス</label>
          <select id="filterViewingStatus">
            <option value="">すべて</option>
            <option value="want">行きたい</option>
            <option value="lottery_applied">先行申込済み</option>
            <option value="lottery_lost">落選</option>
            <option value="purchased">購入済み</option>
            <option value="attended">行った</option>
            <option value="none">未設定</option>
          </select>
        </div>
        <div>
          <label class="filter-label" data-icon="📅">日付（から）</label>
          <input type="date" id="filterDateFrom">
          <label class="filter-label" data-icon="〜">（まで）</label>
          <input type="date" id="filterDateTo">
          <label class="filter-remind-label"><input type="checkbox" id="filterRemindOnly"> 🔔 通知ONのみ</label>
          <label class="filter-exclude-label"><input type="checkbox" id="filterShowExcluded"> 除外済みを表示</label>
          <button class="filter-reset" id="filterReset">リセット</button>
          <span class="filter-count" id="filterCount"></span>
        </div>
      </div>
    </div>
    <div id="controlsSentinel" aria-hidden="true"></div>
    <div id="scheduleRoot">
      <p class="empty">読み込み中...</p>
    </div>
  </div>
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="フライヤー拡大">
  </div>
  <div id="eventModal" class="modal-overlay" onclick="closeEventModal()">
    <div class="modal-panel" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeEventModal()" aria-label="閉じる">&times;</button>
      <div class="modal-header">
        <span class="modal-title" id="eventModalTitle"></span>
        <span class="modal-datetime" id="eventModalDatetime"></span>
      </div>
      <img id="eventModalFlyer" class="modal-flyer" src="" alt="フライヤー" onclick="openLightbox(this.src)" hidden>
      <div id="eventModalBody"></div>
    </div>
  </div>
  <button id="backToTop" class="back-to-top" title="画面最上部へ戻る" aria-label="画面最上部へ戻る">&#x2191;</button>
  <script src="assets/script.js"></script>
</body>
</html>
